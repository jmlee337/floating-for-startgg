name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Use Python 3.11 (for distutils)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node.js and NPM
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: |
          npm ci

      - name: npm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run lint
          npm exec tsc -- --noEmit
          npm run package

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            release/build/FloatingForStartgg*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js and NPM
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: |
          npm ci

      - name: npm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run lint
          npm exec tsc -- --noEmit
          npm run package

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            release/build/FloatingForStartgg*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js and NPM
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: |
          npm ci

      - name: npm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run lint
          npm exec tsc -- --noEmit
          npm run package

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            release/build/FloatingForStartgg*.AppImage
